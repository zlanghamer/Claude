<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capstar Electric — Floor Plan Editor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --bg: #1a1a1e;
    --bg2: #222226;
    --bg3: #2a2a2f;
    --border: #3a3a42;
    --text: #e8e6e0;
    --text-dim: #8a8880;
    --accent: #5b9bd5;
    --accent2: #4a8bc5;
    --danger: #d45b5b;
    --success: #5bb57a;
    --font: 'DM Sans', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }
  /* === TOOLBAR === */
  .toolbar {
    position: fixed; top: 0; left: 0; right: 0; height: 52px; z-index: 100;
    background: var(--bg2); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 16px; gap: 12px;
  }
  .toolbar h1 { font-size: 14px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; }
  .toolbar .sep { width: 1px; height: 24px; background: var(--border); }
  .toolbar .info { font-size: 11px; color: var(--text-dim); font-family: var(--mono); }
  .tb-btn {
    background: var(--bg3); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-family: var(--font); font-size: 12px; font-weight: 500;
    padding: 6px 12px; cursor: pointer; transition: all 0.15s;
  }
  .tb-btn:hover { background: var(--border); }
  .tb-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tb-btn.danger { border-color: var(--danger); color: var(--danger); }
  .tb-btn.danger:hover { background: var(--danger); color: #fff; }
  .tb-spacer { flex: 1; }
  /* === CANVAS AREA === */
  .canvas-wrap {
    position: fixed; top: 52px; left: 0; right: 280px; bottom: 0;
    overflow: hidden; background: var(--bg); cursor: grab;
  }
  .canvas-wrap.dragging { cursor: grabbing; }
  .canvas-inner { position: absolute; transform-origin: 0 0; }
  /* === GRID === */
  .grid-layer {
    position: absolute; top: 0; left: 0; pointer-events: none;
  }
  /* === ROOMS === */
  .room {
    position: absolute; border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 3px; cursor: move; transition: box-shadow 0.1s;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; overflow: hidden; user-select: none;
  }
  .room:hover { box-shadow: 0 0 0 2px var(--accent); z-index: 50; }
  .room.selected { box-shadow: 0 0 0 2px var(--accent), 0 0 12px rgba(91,155,213,0.3); z-index: 51; }
  .room .room-name { font-size: 10px; font-weight: 600; color: #1a1a1e; line-height: 1.2; padding: 0 2px; }
  .room .room-sf { font-size: 8px; color: rgba(26,26,30,0.6); font-family: var(--mono); }
  .room .room-detail { font-size: 7px; color: rgba(26,26,30,0.5); padding: 0 3px; }
  /* Room resize handle */
  .room .resize-handle {
    position: absolute; bottom: 0; right: 0; width: 10px; height: 10px;
    cursor: nwse-resize; background: transparent;
  }
  .room .resize-handle::after {
    content: ''; position: absolute; bottom: 2px; right: 2px;
    width: 6px; height: 6px; border-right: 2px solid rgba(0,0,0,0.3);
    border-bottom: 2px solid rgba(0,0,0,0.3);
  }
  /* === WALLS === */
  .wall { position: absolute; background: #3d3d3a; pointer-events: none; z-index: 40; }
  /* === GRIDLINES === */
  .gridline { position: absolute; pointer-events: none; z-index: 5; }
  .gridline.h { left: 0; height: 1px; border-top: 1px dashed rgba(204,0,0,0.35); }
  .gridline.v { top: 0; width: 1px; border-left: 1px dashed rgba(204,0,0,0.35); }
  .gl-label {
    position: absolute; font-size: 10px; font-weight: 700; color: #cc0000;
    font-family: var(--mono); pointer-events: none; z-index: 6;
  }
  /* === PARKING === */
  .parking {
    position: absolute; background: rgba(200,198,185,0.12);
    border: 1px dashed rgba(200,198,185,0.25); border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--text-dim); pointer-events: none;
  }
  /* === SIDEBAR === */
  .sidebar {
    position: fixed; top: 52px; right: 0; bottom: 0; width: 280px;
    background: var(--bg2); border-left: 1px solid var(--border);
    overflow-y: auto; z-index: 90;
  }
  .sidebar h2 { font-size: 12px; font-weight: 600; padding: 12px 14px 8px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .side-section { padding: 0 14px 12px; border-bottom: 1px solid var(--border); }
  .side-section:last-child { border-bottom: none; }
  .field { margin-bottom: 8px; }
  .field label { display: block; font-size: 10px; color: var(--text-dim); margin-bottom: 3px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 5px;
    color: var(--text); font-family: var(--mono); font-size: 12px; padding: 6px 8px;
    outline: none; transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 48px; font-family: var(--font); }
  .field-row { display: flex; gap: 6px; }
  .field-row .field { flex: 1; }
  .color-grid { display: flex; flex-wrap: wrap; gap: 4px; }
  .color-swatch {
    width: 22px; height: 22px; border-radius: 4px; cursor: pointer;
    border: 2px solid transparent; transition: all 0.1s;
  }
  .color-swatch:hover, .color-swatch.active { border-color: var(--accent); transform: scale(1.15); }
  .room-list { max-height: 300px; overflow-y: auto; }
  .room-list-item {
    display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 4px;
    cursor: pointer; font-size: 11px; transition: background 0.1s;
  }
  .room-list-item:hover { background: var(--bg3); }
  .room-list-item.active { background: rgba(91,155,213,0.15); }
  .room-list-item .swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .room-list-item .name { flex: 1; }
  .room-list-item .sf { font-family: var(--mono); font-size: 9px; color: var(--text-dim); }
  /* === DOOR/WINDOW MARKERS === */
  .marker {
    position: absolute; z-index: 35; pointer-events: none;
  }
  .marker.door { background: #228B22; border-radius: 1px; }
  .marker.window { background: #4488CC; border-radius: 1px; }
  /* === TOOLTIP === */
  .tooltip {
    position: fixed; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font-size: 11px; pointer-events: none;
    opacity: 0; transition: opacity 0.12s; z-index: 200; max-width: 220px; line-height: 1.4;
  }
  /* === EXPORT MODAL === */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 500;
    display: none; align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    width: 600px; max-height: 80vh; overflow-y: auto; padding: 20px;
  }
  .modal h2 { font-size: 16px; margin-bottom: 12px; }
  .modal pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px; font-family: var(--mono); font-size: 10px; color: var(--text-dim);
    overflow-x: auto; max-height: 400px; overflow-y: auto; white-space: pre;
  }
  .modal .actions { display: flex; gap: 8px; margin-top: 12px; }
</style>
</head>
<body>
<!-- TOOLBAR -->
<div class="toolbar">
  <h1>Capstar Electric — Floor Plan Editor</h1>
  <div class="sep"></div>
  <span class="info" id="zoom-info">100%</span>
  <button class="tb-btn" onclick="zoomIn()">+</button>
  <button class="tb-btn" onclick="zoomOut()">−</button>
  <button class="tb-btn" onclick="resetView()">Reset</button>
  <div class="sep"></div>
  <button class="tb-btn" id="btn-grid" onclick="toggleGrid()">Grid</button>
  <button class="tb-btn" id="btn-snap" onclick="toggleSnap()">Snap</button>
  <div class="sep"></div>
  <button class="tb-btn" onclick="addRoom()">+ Room</button>
  <button class="tb-btn danger" onclick="deleteSelected()">Delete</button>
  <div class="tb-spacer"></div>
  <button class="tb-btn" id="btn-undo" onclick="undo()" title="Undo">↶</button>
  <button class="tb-btn" id="btn-redo" onclick="redo()" title="Redo">↷</button>
  <button class="tb-btn" onclick="exportJSON()">Export JSON</button>
  <button class="tb-btn" style="background:var(--accent);border-color:var(--accent);color:#fff" onclick="exportJSON()">Save</button>
</div>
<!-- CANVAS -->
<div class="canvas-wrap" id="canvasWrap">
  <div class="canvas-inner" id="canvasInner"></div>
</div>
<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

  <div class="side-section" id="props-panel">
    <p style="font-size:11px;color:var(--text-dim);padding:8px 0;">Click a room to edit</p>
  </div>
  <h2>Rooms</h2>
  <div class="side-section">
    <div class="room-list" id="room-list"></div>
  </div>
</div>
<!-- EXPORT MODAL -->
<div class="modal-overlay" id="exportModal">
  <div class="modal">
    <h2>Export Floor Plan Data</h2>
    <p style="font-size:12px;color:var(--text-dim);margin-bottom:10px;">Copy this JSON into Claude Code to continue editing programmatically.</p>
    <pre id="exportData"></pre>
    <div class="actions">
      <button class="tb-btn" onclick="copyExport()">Copy to Clipboard</button>
      <button class="tb-btn" onclick="downloadExport()">Download .json</button>
      <button class="tb-btn" onclick="document.getElementById('exportModal').classList.remove('show')">Close</button>
    </div>
  </div>
</div>
<div class="tooltip" id="tooltip"></div>

  { type: 'door', x: 140, y: 210, orient: 'v', len: 4, desc: 'Main entry (NE)' },
  { type: 'door', x: 10, y: 113.33, orient: 'h', len: 4, desc: 'Office to WH' },
  { type: 'door', x: 60, y: 113.33, orient: 'h', len: 4, desc: 'Office to WH' },
  { type: 'door', x: 140, y: 70, orient: 'v', len: 4, desc: 'Svc stock ext entry' },
  { type: 'door', x: 58, y: 113.33, orient: 'h', len: 3, desc: 'Svc dispatch to WH' },
  // Dock doors
  { type: 'door', x: 8, y: 0, orient: 'h', len: 3, desc: 'Dock' },
  { type: 'door', x: 19, y: 0, orient: 'h', len: 3, desc: 'Dock' },
  { type: 'door', x: 30, y: 0, orient: 'h', len: 3, desc: 'Dock' },
  { type: 'door', x: 41, y: 0, orient: 'h', len: 3, desc: 'Dock' },
  { type: 'door', x: 52, y: 0, orient: 'h', len: 3, desc: 'Dock' },
  { type: 'door', x: 63, y: 0, orient: 'h', len: 3, desc: 'Dock' },
  { type: 'door', x: 74, y: 0, orient: 'h', len: 3, desc: 'Dock' },
  { type: 'door', x: 85, y: 0, orient: 'h', len: 3, desc: 'Dock' },
  { type: 'door', x: 96, y: 0, orient: 'h', len: 3, desc: 'Dock' },
  { type: 'door', x: 107, y: 0, orient: 'h', len: 3, desc: 'Dock' },
  { type: 'door', x: 118, y: 0, orient: 'h', len: 3, desc: 'Dock' },
  { type: 'door', x: 129, y: 0, orient: 'h', len: 3, desc: 'Dock' },
  // Windows (north wall)
  { type: 'window', x: 2, y: 220, orient: 'h', len: 20, desc: 'Lg conf windows' },
  { type: 'window', x: 26, y: 220, orient: 'h', len: 12, desc: 'Sm conf windows' },
  { type: 'window', x: 54, y: 220, orient: 'h', len: 10, desc: 'Est 1 window' },
  { type: 'window', x: 68, y: 220, orient: 'h', len: 10, desc: 'Est 2 window' },
  { type: 'window', x: 82, y: 220, orient: 'h', len: 10, desc: 'Est 3 window' },
  { type: 'window', x: 102, y: 220, orient: 'h', len: 14, desc: 'Owner window' },
  { type: 'window', x: 120, y: 220, orient: 'h', len: 18, desc: 'Reception window' },
  // Windows (east wall)
  { type: 'window', x: 140, y: 202, orient: 'v', len: 16, desc: 'Reception east' },
  { type: 'window', x: 140, y: 171, orient: 'v', len: 25, desc: 'Flex est windows' },
  { type: 'window', x: 140, y: 115, orient: 'v', len: 13, desc: 'VP Ops window' },
  { type: 'window', x: 140, y: 132, orient: 'v', len: 12, desc: 'PM 1 window' },
  { type: 'window', x: 140, y: 148, orient: 'v', len: 12, desc: 'PM 2 window' },
];
// ============================================================
// STATE
// ============================================================
let zoom = 1.0;
let panX = 40, panY = 40;
let selectedId = null;
let showGrid = true;
let snapEnabled = true;
let isDragging = false;
let dragTarget = null;
let dragType = null; // 'move' or 'resize'
let dragStartX, dragStartY, dragOrigX, dragOrigY, dragOrigW, dragOrigH;
let isPanning = false;
let panStartX, panStartY, panOrigX, panOrigY;
let nextId = 100;
const S_PX = CONFIG.scale;
const wrap = document.getElementById('canvasWrap');
const inner = document.getElementById('canvasInner');
// ============================================================
// HISTORY MANAGEMENT
// ============================================================
let undoStack = [];
let redoStack = [];
const maxHistorySize = 50;
function saveToHistory() {
  undoStack.push(JSON.stringify(rooms));
  if (undoStack.length > maxHistorySize) undoStack.shift();
  redoStack = [];
  updateHistoryButtons();
}
function undo() {
  if (undoStack.length === 0) return;
  redoStack.push(JSON.stringify(rooms));
  rooms = JSON.parse(undoStack.pop());
  render(); showProps(selectedId);
  updateHistoryButtons();
}
function redo() {
  if (redoStack.length === 0) return;
  undoStack.push(JSON.stringify(rooms));
  rooms = JSON.parse(redoStack.pop());
  render(); showProps(selectedId);
  updateHistoryButtons();
}
function updateHistoryButtons() {
  document.getElementById('btn-undo').disabled = undoStack.length === 0;
  document.getElementById('btn-redo').disabled = redoStack.length === 0;
  document.getElementById('btn-undo').style.opacity = undoStack.length === 0 ? '0.5' : '1';
  document.getElementById('btn-redo').style.opacity = redoStack.length === 0 ? '0.5' : '1';
}
// ============================================================
// RENDER
// ============================================================
function render() {
  inner.innerHTML = '';
  const bw = CONFIG.buildingWidth * S_PX;
  const bd = CONFIG.buildingDepth * S_PX;
  inner.style.width = (bw + 400) + 'px';
  inner.style.height = (bd + 400) + 'px';
  // Parking areas
  const pn = CONFIG.parking.north;
  addDiv(inner, 'parking', 0, -(pn.depth * S_PX), bw, pn.depth * S_PX, '', pn.label);
  const pe = CONFIG.parking.east;
  addDiv(inner, 'parking', bw, 0, pe.width * S_PX, bd, '', pe.label);
  // Truck court
  addDiv(inner, 'parking', 0, bd, bw, 35 * S_PX, '', '130\' Truck Court (South)');
  // 10' grid
  if (showGrid) {
    for (let gx = 0; gx <= CONFIG.buildingWidth; gx += CONFIG.gridSize) {
      const el = document.createElement('div');
      el.style.cssText = `position:absolute;left:${gx*S_PX}px;top:${-pn.depth*S_PX}px;width:1px;height:${bd+pn.depth*S_PX+35*S_PX}px;background:rgba(255,255,255,0.03);pointer-events:none;`;
      inner.appendChild(el);
    }
    for (let gy = 0; gy <= CONFIG.buildingDepth; gy += CONFIG.gridSize) {
      const el = document.createElement('div');
      el.style.cssText = `position:absolute;top:${(CONFIG.buildingDepth-gy)*S_PX}px;left:0;height:1px;width:${bw}px;background:rgba(255,255,255,0.03);pointer-events:none;`;
      inner.appendChild(el);
    }
  }
  // Structural gridlines
  CONFIG.gridlines.horizontal.forEach(gl => {
    const py = (CONFIG.buildingDepth - gl.y) * S_PX;
    const el = document.createElement('div');
    el.className = 'gridline h';
    el.style.cssText = `top:${py}px;width:${bw}px;`;
    inner.appendChild(el);
    const lbl = document.createElement('div');
    lbl.className = 'gl-label';
    lbl.style.cssText = `top:${py-8}px;left:${-22}px;`;
    lbl.textContent = gl.label;
    inner.appendChild(lbl);
  });
  CONFIG.gridlines.vertical.forEach(gl => {
    const ppx = gl.x * S_PX;
    const el = document.createElement('div');
    el.className = 'gridline v';
    el.style.cssText = `left:${ppx}px;height:${bd}px;`;
    inner.appendChild(el);
    const lbl = document.createElement('div');
    lbl.className = 'gl-label';
    lbl.style.cssText = `left:${ppx-5}px;top:${-18}px;`;
    lbl.textContent = gl.label;
    inner.appendChild(lbl);
  });
  // Building outline
  const outline = document.createElement('div');
  outline.className = 'wall';
  outline.style.cssText = `left:-2px;top:-2px;width:${bw+4}px;height:${bd+4}px;background:none;border:3px solid #3d3d3a;border-radius:2px;z-index:3;`;
  inner.appendChild(outline);
  // Dividing wall at C-line
  const cLineY = (CONFIG.buildingDepth - 113.33) * S_PX;
  const divWall = document.createElement('div');
  divWall.className = 'wall';
  divWall.style.cssText = `left:0;top:${cLineY}px;width:${bw}px;height:3px;`;
  inner.appendChild(divWall);
  // Rooms (y is flipped: screen y = (buildingDepth - room.y - room.h) * scale)
  rooms.forEach(r => {
    const el = document.createElement('div');
    el.className = 'room' + (r.id === selectedId ? ' selected' : '');
    el.dataset.id = r.id;
    const sx = r.x * S_PX;
    const sy = (CONFIG.buildingDepth - r.y - r.h) * S_PX;
    const sw = r.w * S_PX;
    const sh = r.h * S_PX;
    const col = r.customColor || DEPT_COLORS[r.dept]?.fill || '#ccc';
    el.style.cssText = `left:${sx}px;top:${sy}px;width:${sw}px;height:${sh}px;background:${col};transform:rotate(${r.rotation}deg);`;

    const sf = Math.round(r.w * r.h);
    el.innerHTML = `
      <div class="room-name">${r.name}</div>
      ${sh > 30 ? `<div class="room-sf">${sf} SF</div>` : ''}
      ${sh > 50 && r.people ? `<div class="room-detail">${r.people}</div>` : ''}
      <div class="resize-handle"></div>
    `;
    el.addEventListener('mousedown', e => startDrag(e, r.id));
    el.querySelector('.resize-handle').addEventListener('mousedown', e => { e.stopPropagation(); startResize(e, r.id); });
    el.addEventListener('click', e => { if (!isDragging) selectRoom(r.id); });
    inner.appendChild(el);
  });
  // Markers (doors + windows)
  markers.forEach(m => {
    const el = document.createElement('div');
    el.className = 'marker ' + m.type;
    if (m.orient === 'h') {
      const mx = m.x * S_PX;
      const my = (CONFIG.buildingDepth - m.y) * S_PX;
      el.style.cssText = `left:${mx}px;top:${my-1.5}px;width:${m.len*S_PX}px;height:3px;`;
    } else {
      const mx = m.x * S_PX;
      const my = (CONFIG.buildingDepth - m.y - m.len) * S_PX;
      el.style.cssText = `left:${mx-1.5}px;top:${my}px;width:3px;height:${m.len*S_PX}px;`;
    }
    inner.appendChild(el);
  });
  updateTransform();
  renderRoomList();
}
function addDiv(parent, cls, left, top, w, h, style, text) {
  const el = document.createElement('div');
  el.className = cls;
  el.style.cssText = `left:${left}px;top:${top}px;width:${w}px;height:${h}px;${style}`;
  if (text) el.textContent = text;
  parent.appendChild(el);
}
function updateTransform() {
  inner.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  document.getElementById('zoom-info').textContent = Math.round(zoom * 100) + '%';
}
// ============================================================
// ROOM LIST
// ============================================================
function renderRoomList() {
  const list = document.getElementById('room-list');
  list.innerHTML = rooms.map(r => {
    const col = DEPT_COLORS[r.dept]?.fill || '#ccc';
    const sf = Math.round(r.w * r.h);
    return `<div class="room-list-item${r.id===selectedId?' active':''}" onclick="selectRoom('${r.id}')">
      <span class="swatch" style="background:${col}"></span>
      <span class="name">${r.name}</span>
      <span class="sf">${sf}</span>
    </div>`;
  }).join('');
}
// ============================================================
// SELECTION & PROPERTIES
// ============================================================
function selectRoom(id) {
  selectedId = id;
  render();
  showProps(id);
}
function showProps(id) {
  const r = rooms.find(rm => rm.id === id);
  const panel = document.getElementById('props-panel');
  if (!r) { panel.innerHTML = '<p style="font-size:11px;color:var(--text-dim);padding:8px 0;">Click a room to edit</p>'; return; }
  const sf = Math.round(r.w * r.h);
  const deptOpts = Object.entries(DEPT_COLORS).map(([k,v]) =>
    `<option value="${k}"${k===r.dept?' selected':''}>${v.label}</option>`
  ).join('');
  panel.innerHTML = `
    <div class="field"><label>Name</label><input value="${r.name}" onchange="updateProp('${id}','name',this.value)"/></div>
    <div class="field"><label>Department</label><select onchange="updateProp('${id}','dept',this.value)">${deptOpts}</select></div>
    <div class="field"><label>Color</label><input type="color" value="${(r.customColor || DEPT_COLORS[r.dept]?.fill || '#cccccc').replace(/[^#0-9a-f]/g, '').substring(0, 7) || '#cccccc'}" onchange="updateProp('${id}','customColor',this.value)"/></div>
    <div class="field"><label>Rotation</label><input type="number" step="5" min="0" max="360" value="${r.rotation}" onchange="updateProp('${id}','rotation',+this.value)"/></div>
    <div class="field-row">
      <div class="field"><label>X (ft)</label><input type="number" step="1" value="${r.x}" onchange="updateProp('${id}','x',+this.value)"/></div>
      <div class="field"><label>Y (ft)</label><input type="number" step="1" value="${r.y}" onchange="updateProp('${id}','y',+this.value)"/></div>
    </div>
    <div class="field-row">
      <div class="field"><label>W (ft)</label><input type="number" step="1" value="${r.w}" onchange="updateProp('${id}','w',+this.value)"/></div>
      <div class="field"><label>H (ft)</label><input type="number" step="1" value="${r.h}" onchange="updateProp('${id}','h',+this.value)"/></div>
    </div>
    <div class="field"><label>Area</label><input value="${sf} SF (${r.w}' x ${r.h}')" disabled/></div>
    <div class="field"><label>People</label><input value="${r.people||''}" onchange="updateProp('${id}','people',this.value)"/></div>
    <div class="field"><label>Detail</label><textarea onchange="updateProp('${id}','detail',this.value)">${r.detail||''}</textarea></div>
  `;
}
function updateProp(id, prop, val) {
  const r = rooms.find(rm => rm.id === id);
  if (r) { saveToHistory(); r[prop] = val; render(); showProps(id); }
}
// ============================================================
// DRAG & RESIZE
// ============================================================
function startDrag(e, id) {
  if (e.target.classList.contains('resize-handle')) return;
  e.preventDefault();
  const r = rooms.find(rm => rm.id === id);
  if (!r) return;
  dragTarget = id; dragType = 'move';
  dragStartX = e.clientX; dragStartY = e.clientY;
  dragOrigX = r.x; dragOrigY = r.y;
  isDragging = false;
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', endDrag);
}
function startResize(e, id) {
  e.preventDefault();
  const r = rooms.find(rm => rm.id === id);
  if (!r) return;
  dragTarget = id; dragType = 'resize';
  dragStartX = e.clientX; dragStartY = e.clientY;
  dragOrigW = r.w; dragOrigH = r.h;
  isDragging = false;
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', endDrag);
}
function onDrag(e) {
  isDragging = true;
  const r = rooms.find(rm => rm.id === dragTarget);
  if (!r) return;
  const dx = (e.clientX - dragStartX) / zoom / S_PX;
  const dy = -(e.clientY - dragStartY) / zoom / S_PX; // flip Y
  const snap = snapEnabled ? CONFIG.snapSize : 0.5;
  if (dragType === 'move') {
    r.x = Math.round((dragOrigX + dx) / snap) * snap;
    r.y = Math.round((dragOrigY + dy) / snap) * snap;
  } else {
    r.w = Math.max(4, Math.round((dragOrigW + dx) / snap) * snap);
    r.h = Math.max(4, Math.round((dragOrigH - dy) / snap) * snap);
  }
  render();
  showProps(dragTarget);
}
function endDrag() {
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', endDrag);
  if (isDragging) { saveToHistory(); selectRoom(dragTarget); }
  isDragging = false; dragTarget = null;
}
// ============================================================
// PAN & ZOOM
// ============================================================
wrap.addEventListener('mousedown', e => {
  if (e.target === wrap || e.target === inner) {
    isPanning = true; wrap.classList.add('dragging');
    panStartX = e.clientX; panStartY = e.clientY;
    panOrigX = panX; panOrigY = panY;
  }
});
document.addEventListener('mousemove', e => {
  if (isPanning) {
    panX = panOrigX + (e.clientX - panStartX);
    panY = panOrigY + (e.clientY - panStartY);
    updateTransform();
  }
});
document.addEventListener('mouseup', () => { isPanning = false; wrap.classList.remove('dragging'); });
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  zoom = Math.max(0.3, Math.min(4, zoom * delta));
  updateTransform();
}, { passive: false });
function zoomIn() { zoom = Math.min(4, zoom * 1.2); updateTransform(); }
function zoomOut() { zoom = Math.max(0.3, zoom / 1.2); updateTransform(); }
function resetView() { zoom = 1; panX = 40; panY = 40; updateTransform(); }
// ============================================================
// GRID & SNAP TOGGLES
// ============================================================
function toggleGrid() { showGrid = !showGrid; document.getElementById('btn-grid').classList.toggle('active', showGrid); render(); }
function toggleSnap() { snapEnabled = !snapEnabled; document.getElementById('btn-snap').classList.toggle('active', snapEnabled); }
// ============================================================
// ADD & DELETE ROOMS
// ============================================================
function addRoom() {
  saveToHistory();
  const id = 'room_' + (nextId++);
  rooms.push({ id, x: 60, y: 140, w: 14, h: 14, dept: 'com', name: 'New Room', detail: '', people: '', rotation: 0, customColor: null });
  selectRoom(id);
  render(); showProps(id);
}
function deleteSelected() {
  if (!selectedId) return;
  if (!confirm('Delete "' + (rooms.find(r=>r.id===selectedId)?.name||'') + '"?')) return;
  saveToHistory();
  rooms = rooms.filter(r => r.id !== selectedId);
  selectedId = null;
  render();
  document.getElementById('props-panel').innerHTML = '<p style="font-size:11px;color:var(--text-dim);padding:8px 0;">Click a room to edit</p>';
}
// ============================================================
// EXPORT
// ============================================================
function exportJSON() {
  const data = {
    _meta: {
      project: 'Capstar Electric',
      building: 'Georgetown Logistics Park - Building 03',
      space: 'GL 8.5-11 x A-E (140\' x 220\')',
      version: 'v6-interactive',
      exported: new Date().toISOString(),
      notes: 'A=North(parking/entry) E=South(dock) 11=East 8.5=West(demising). All coords in feet. y=0 is south (E-line).'
    },
    config: CONFIG,
    departments: DEPT_COLORS,
    rooms: rooms,
    markers: markers
  };
  const json = JSON.stringify(data, null, 2);
  document.getElementById('exportData').textContent = json;
  document.getElementById('exportModal').classList.add('show');
}
function copyExport() {
  const text = document.getElementById('exportData').textContent;
  navigator.clipboard.writeText(text).then(() => alert('Copied to clipboard!'));
}
function downloadExport() {
  const text = document.getElementById('exportData').textContent;
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'capstar_floor_plan.json'; a.click();
  URL.revokeObjectURL(url);
}
// ============================================================
// KEYBOARD SHORTCUTS
// ============================================================
document.addEventListener('keydown', e => {
  const isCtrlZ = (e.ctrlKey || e.metaKey) && e.key === 'z';
  const isCtrlShiftZ = (e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'z';
  const isCtrlY = (e.ctrlKey || e.metaKey) && e.key === 'y';

  if (isCtrlZ) { e.preventDefault(); undo(); return; }
  if (isCtrlShiftZ || isCtrlY) { e.preventDefault(); redo(); return; }

  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  const r = rooms.find(rm => rm.id === selectedId);
  const step = snapEnabled ? CONFIG.snapSize : 1;
  if (e.key === 'Delete' || e.key === 'Backspace') { deleteSelected(); }
  else if (e.key === 'Escape') { selectedId = null; render(); }
  else if (e.key === 'ArrowLeft' && r) { saveToHistory(); r.x -= step; render(); showProps(selectedId); }
  else if (e.key === 'ArrowRight' && r) { saveToHistory(); r.x += step; render(); showProps(selectedId); }
  else if (e.key === 'ArrowUp' && r) { saveToHistory(); r.y += step; render(); showProps(selectedId); }
  else if (e.key === 'ArrowDown' && r) { saveToHistory(); r.y -= step; render(); showProps(selectedId); }
  else if (e.key === '+' || e.key === '=') zoomIn();
  else if (e.key === '-') zoomOut();
});
// INIT
document.getElementById('btn-grid').classList.add('active');
document.getElementById('btn-snap').classList.add('active');
updateHistoryButtons();
render();
</script>
